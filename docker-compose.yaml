services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_MODEL_ARG: ${HERMES_MODEL:-minimax/minimax-m2.7}
        OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
        DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    image: ghcr.io/yevgeniusr/hermes-agent:latest
    restart: unless-stopped
    volumes:
      - hermes-data:/home/hermes
    environment:
      # Runtime env vars - hardcode defaults so Coolify compose generation can't wipe them
      - HERMES_MODEL=${HERMES_MODEL:-minimax/minimax-m2.7}
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-openrouter}
      - HERMES_GATEWAY_PORT=${HERMES_GATEWAY_PORT:-18790}
      - HERMES_BACKGROUND_NOTIFICATIONS=${HERMES_BACKGROUND_NOTIFICATIONS:-result}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS:-588858125126336544,1484966987321835733}
      - "DISCORD_REQUIRE_MENTION=${DISCORD_REQUIRE_MENTION:-true}"
      - DISCORD_FREE_RESPONSE_CHANNELS=${DISCORD_FREE_RESPONSE_CHANNELS:-1489982401445888000,1489982424594251920}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # --- Marketing Director Tools ---
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - FALAI_API_KEY=${FALAI_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
      - POSTIZ_WEBHOOK_SECRET=${POSTIZ_WEBHOOK_SECRET:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - CONTENT_REPO=${CONTENT_REPO:-https://github.com/yevgeniusr/content-studio}
    ports:
      - "18790:18790"

volumes:
  hermes-data:
    driver: local
