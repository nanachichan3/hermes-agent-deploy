services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_MODEL_ARG: ${HERMES_MODEL:-minimax/minimax-m2.7}
        OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
        DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    image: ghcr.io/yevgeniusr/hermes-agent:latest
    restart: unless-stopped
    volumes:
      - hermes-data:/home/hermes
    environment:
      # Runtime env vars - HERMES_MODEL always has a fallback (do not leave empty)
      - HERMES_MODEL=${HERMES_MODEL:-minimax/minimax-m2.7}
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    ports:
      - "18790:18790"

volumes:
  hermes-data:
    driver: local
